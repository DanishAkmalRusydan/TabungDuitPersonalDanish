<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ringgit Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Caslon+Text:wght@400;700&display=swap">
<style>
/* VOICE: calm and exact, like a bank passbook kept by someone careful
   IDEA: a savings passbook, with ruled ledger lines and one balance printed large
   PICTURE: the balance figure over a full-width spend gauge with an even-pace marker
   COLOUR and TYPE: white, ink and a deep teal band; Libre Caslon Text for figures, Inter for everything else
   LAYOUT: teal band with tabs, balance hero, then category gauges beside recent lines; one column on phones */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0d1416);--ink:light-dark(#14161a,#e6ecec);--mut:light-dark(#5b6570,#9aa8a9);--rule:light-dark(#dfe3e6,#23302f);--soft:light-dark(#f1f5f5,#142224);--teal:light-dark(#0b5d63,#5cc0c6);--onteal:light-dark(#fff,#06181a);--band:light-dark(#0b5d63,#0f3236);--neg:light-dark(#b3261e,#ff8b80);--negbg:light-dark(#fbeceb,#2b1716);--pos:light-dark(#1c7a46,#6fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:110px}
h1,h2,h3{font-family:'Libre Caslon Text',Georgia,serif;font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5vw,40px)}h2{font-size:22px}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.top{background:var(--band);color:#fff;padding:18px max(5vw,16px) 0}
.in{max-width:1000px;margin:0 auto}
.brand{font:400 22px/1.1 'Libre Caslon Text',Georgia,serif;margin:0 0 8px}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
#nav button{flex:none;background:none;border:0;color:#fff;opacity:.72;font-weight:500;font-size:15px;padding:12px 14px;min-height:46px;border-bottom:3px solid transparent;cursor:pointer}
#nav button[aria-current=page]{opacity:1;border-color:#fff}
.note{background:var(--soft);padding:10px max(5vw,16px);font-size:14px;text-align:center}
main{max-width:1000px;margin:0 auto;padding:clamp(22px,4vw,40px) max(5vw,16px)}
.mut{color:var(--mut)}.small{font-size:14px}
.vh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);font-weight:500;font-size:15px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}.pri{background:var(--teal);color:var(--onteal);border-color:transparent}.pri:hover{border-color:transparent;filter:brightness(1.08)}
.danger{color:var(--neg)}.sm{min-height:36px;padding:0 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:var(--bg);cursor:pointer;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{padding-bottom:28px;border-bottom:2px solid var(--ink)}
.eyebrow{margin:0;color:var(--mut);font-size:15px}
.big{font:400 clamp(46px,10vw,78px)/1 'Libre Caslon Text',Georgia,serif;margin:10px 0 8px;letter-spacing:-.01em;white-space:nowrap}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.sub{margin:0 0 18px;color:var(--mut)}
.gauge{position:relative;height:16px;border-radius:4px;background:var(--soft) repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--rule) calc(10% - 1px) 10%)}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:4px;transition:width .6s ease}
.gauge i.over{background:var(--neg)}
.gauge b{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);margin-left:-1px}
.gl{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mut);margin:8px 0 0}
.pace{margin:16px 0 0;font-size:17px;max-width:62ch}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,5vw,56px);margin-top:30px}
.cols h2{margin-bottom:6px}
.cat{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.cat .nm{display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .am{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.cat .am small{color:var(--mut)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:11px 4px;cursor:pointer;min-height:58px}
.row:hover{background:var(--soft)}
.rt{display:flex;flex-direction:column;overflow:hidden}.rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rm{font-size:13px;color:var(--mut)}
.ra{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}
.ra small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.due{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.empty{padding:20px 0 10px;max-width:640px}.empty p{font-size:17px}.empty .acts{margin-top:18px}
.emptyl{padding:28px 0;color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.card{border-bottom:1px solid var(--rule);padding:18px 0}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px}.ch p{margin:4px 0 0;font-size:14px}
.ch .ra{font-size:20px}
details.arc{margin-top:26px}details.arc summary{cursor:pointer;color:var(--mut);min-height:44px;display:flex;align-items:center}
.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr);gap:8px;margin-bottom:14px}
.lt{display:flex;justify-content:space-between;color:var(--mut);margin:6px 0}
.day h3{display:flex;justify-content:space-between;font:600 13px Inter,sans-serif;color:var(--mut);padding:18px 4px 6px;border-bottom:2px solid var(--ink)}
.sec{padding:22px 0;border-bottom:1px solid var(--rule)}.sec p{margin:6px 0 12px}
.cr{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0}
.cr.add{grid-template-columns:minmax(0,1fr) auto}
input,select,textarea{width:100%;font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--bg)}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--teal);margin:0}
label,.lab{display:block;font-size:14px;color:var(--mut);margin:16px 0 6px}
.ck{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;min-height:44px;margin:10px 0 0;cursor:pointer}
.amt{font:400 34px 'Libre Caslon Text',Georgia,serif;min-height:62px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg label{margin:0;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border:1px solid var(--rule);border-radius:999px;color:var(--ink);font-size:15px;cursor:pointer}
.seg input:checked+span{background:var(--teal);color:var(--onteal);border-color:var(--teal)}
.seg input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.lg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px}
.li{display:grid;gap:4px;margin:0;color:var(--ink)}.li span{display:flex;align-items:center;gap:7px;font-size:14px}
#bf[data-type=monthly] .oo,#bf[data-type=oneoff] .mo,#bf.to .lims{display:none}
.warn{margin-top:16px;padding:11px 13px;border-radius:10px;background:var(--soft);font-size:15px}
.warn.bad{background:var(--negbg);color:var(--neg)}
.err{color:var(--neg);font-size:14px;margin:10px 0 0;min-height:1em}
.mf{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.mf .grow{margin-left:auto}
#fab{position:fixed;right:max(16px,calc(50vw - 500px + 5vw));bottom:22px;min-height:56px;padding:0 24px;border-radius:999px;border:0;background:var(--teal);color:var(--onteal);font-weight:600;font-size:16px;box-shadow:0 8px 24px rgb(0 0 0/.22);cursor:pointer;z-index:20}
.ov{position:fixed;inset:0;background:rgb(0 0 0/.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.ov[hidden],.toast[hidden],.note[hidden]{display:none}
.sheet{background:var(--bg);width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:24px max(4vw,18px) 28px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgb(0 0 0/.25)}
.tb{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;min-height:40px;padding:0 10px;cursor:pointer}
.csv{min-height:220px;font:13px/1.4 ui-monospace,monospace}
.loading{color:var(--mut);padding:40px 0}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:18px}}
@media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters input{grid-column:1/-1}.cat{grid-template-columns:minmax(0,1fr) auto}.cat .bar{grid-column:1/-1;order:3}.lg{grid-template-columns:minmax(0,1fr)}#fab{right:16px;left:16px}.gl{font-size:13px}}
@media(prefers-reduced-motion:reduce){.gauge i{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <p class="brand">Ringgit Ledger</p>
  <nav id="nav" aria-label="Sections">
    <button data-act="go" data-v="home">Overview</button>
    <button data-act="go" data-v="ledger">Ledger</button>
    <button data-act="go" data-v="budgets">Budgets</button>
    <button data-act="go" data-v="recurring">Recurring</button>
    <button data-act="go" data-v="options">Settings</button>
  </nav>
</div></header>
<div id="note" class="note" hidden></div>
<main id="view"><p class="loading">Opening your ledger…</p></main>
<button id="fab" data-act="add">+ Add expense</button>
<div id="modal" class="ov" hidden><div class="sheet" role="dialog" aria-modal="true" id="mbody"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c,12)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const uidg=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round(n*100)/100;
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.]/g,''));return isFinite(n)?r2(n):NaN};
const fmt=n=>(n<-0.004?'−':'')+'RM '+Math.abs(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const dlabel=s=>pd(s).toLocaleDateString('en-MY',{day:'numeric',month:'short'});
const mlabel=m=>pd(m+'-01').toLocaleDateString('en-MY',{month:'long',year:'numeric'});
const sum=a=>a.reduce((t,x)=>t+(+x.amount||0),0);
const PALETTE=['#0b5d63','#2f6fb0','#7a4fb0','#c0532b','#b0892f','#3f8f4f','#a03a6b','#6b7280','#1e8a8a','#8a5a2b'];
const PAY={cash:'Cash',card:'Card',ewallet:'E-wallet'};
const VIEWS=['home','ledger','budgets','recurring','options'];
const defCfg=()=>({cycleDay:1,categories:['Food','Transport','Bills','Shopping','Health','Entertainment','Savings','Other'].map((n,i)=>({id:n.toLowerCase(),name:n,color:PALETTE[i]})),budgets:[],recurring:[],posted:{}});

let cfg=defCfg(),months={},view=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'home',sel=null,local=false,col=null,loaded=false,recRan=false,undoFn=null,lastFocus=null,tt=null;
const filt={m:today().slice(0,7),b:'',q:''};

/* ---------- storage ---------- */
const queue={};
function put(id,data){
  if(local){try{localStorage.setItem('rl-data',JSON.stringify({cfg,months}))}catch(e){}return}
  if(!col)return;
  queue[id]=(queue[id]||Promise.resolve()).then(()=>data?col.doc(id).set(data):col.doc(id).delete()).catch(e=>toast(e&&e.code==='quota_exceeded'?'Storage is full. Export, then delete old entries.':'Could not save. Check your connection.'));
}
const saveCfg=()=>put('config',JSON.parse(JSON.stringify(cfg)));
const saveMonth=k=>put('m_'+k,months[k]&&months[k].length?{entries:months[k]}:null);
const lsGet=()=>{try{return JSON.parse(localStorage.getItem('rl-last')||'{}')}catch(e){return{}}};
const lsSet=v=>{try{localStorage.setItem('rl-last',JSON.stringify(v))}catch(e){}};
function normalize(c){c=c||defCfg();c.cycleDay=c.cycleDay||1;c.categories=c.categories&&c.categories.length?c.categories:defCfg().categories;c.budgets=c.budgets||[];c.recurring=c.recurring||[];c.posted=c.posted||{};return c}

/* ---------- data helpers ---------- */
const all=()=>Object.values(months).flat();
const B=id=>cfg.budgets.find(b=>b.id===id);
const Cat=id=>cfg.categories.find(c=>c.id===id)||{id,name:'Uncategorised',color:'#888'};
const activeBudgets=()=>cfg.budgets.filter(b=>!b.archived);
function upsertEntry(e){
  const touched=new Set();
  for(const k in months){const i=months[k].findIndex(x=>x.id===e.id);if(i>-1){months[k].splice(i,1);touched.add(k)}}
  const k=e.date.slice(0,7);(months[k]=months[k]||[]).push(e);touched.add(k);touched.forEach(saveMonth);
}
function removeEntry(id){for(const k in months){const i=months[k].findIndex(x=>x.id===id);if(i>-1){const r=months[k].splice(i,1)[0];saveMonth(k);return r}}return null}
function cycleOf(s){
  const cd=Math.min(28,Math.max(1,+cfg.cycleDay||1)),d=pd(s);let y=d.getFullYear(),m=d.getMonth();
  if(d.getDate()<cd){m--;if(m<0){m=11;y--}}
  let ny=y,nm=m+1;if(nm>11){nm=0;ny++}
  return{start:iso(new Date(y,m,cd,12)),end:iso(new Date(ny,nm,cd-1,12))};
}
function stats(b,ref,excludeId){
  ref=ref||today();
  const ents=all().filter(e=>e.budgetId===b.id&&e.id!==excludeId),tops=b.topups||[],inR=(d,s,e)=>d>=s&&d<=e;
  let s,e,total,list,carry=0;
  if(b.type==='monthly'){
    const c=cycleOf(ref);s=c.start;e=c.end;
    if(b.rollover&&b.start<s){let c2=cycleOf(b.start),g=0;while(c2.start<s&&g++<240){carry+=b.amount+sum(tops.filter(x=>inR(x.date,c2.start,c2.end)))-sum(ents.filter(x=>inR(x.date,c2.start,c2.end)));c2=cycleOf(addDays(c2.end,1))}}
    list=ents.filter(x=>inR(x.date,s,e));total=b.amount+sum(tops.filter(x=>inR(x.date,s,e)))+carry;
  }else{s=b.start;e=b.end||'';list=ents;total=b.amount+sum(tops)}
  const spent=r2(sum(list)),byCat={};list.forEach(x=>byCat[x.catId]=(byCat[x.catId]||0)+x.amount);
  let pace=null;const t=today();
  if(e&&t>=s&&t<=e){const days=diff(s,e)+1,el=diff(s,t)+1,left=diff(t,e)+1;pace={days,el,left,perDay:(total-spent)/left,avg:spent/el,expected:total*el/days}}
  return{s,e,total:r2(total),carry:r2(carry),spent,remaining:r2(total-spent),byCat,list,pace};
}
function dueDate(r,c){
  const s=pd(c.start);let y=s.getFullYear(),m=s.getMonth();
  if(+r.day<s.getDate()){m++;if(m>11){m=0;y++}}
  return iso(new Date(y,m,Math.min(+r.day,new Date(y,m+1,0).getDate()),12));
}
const recState=r=>{const c=cycleOf(today());return{c,due:dueDate(r,c),st:(cfg.posted[r.id]||{})[c.start]||''}};
function mark(r,c,v){const p=cfg.posted[r.id]=cfg.posted[r.id]||{};if(v)p[c]=v;else delete p[c];const ks=Object.keys(p).sort();while(ks.length>4)delete p[ks.shift()]}
function postRec(r,c,date){
  upsertEntry({id:'r_'+r.id+'_'+c.start,date,amount:r2(+r.amount),catId:r.catId,budgetId:r.budgetId,note:r.name,pay:r.pay||'',rec:r.id});
  mark(r,c.start,'posted');
}
function runRecurring(){
  let n=0;const t=today();
  cfg.recurring.forEach(r=>{const b=B(r.budgetId);if(!r.active||!b||b.archived||b.type!=='monthly')return;const{c,due,st}=recState(r);if(!st&&due<=t){postRec(r,c,due);n++}});
  if(n){saveCfg();toast(`Posted ${n} recurring item${n>1?'s':''}`)}
  return n;
}

/* ---------- UI shell ---------- */
function note(t){const el=$('#note');el.textContent=t;el.hidden=!t}
function toast(msg,undo){const el=$('#toast');el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button class="tb" data-act="undo">Undo</button>':''}`;el.hidden=false;undoFn=undo||null;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;undoFn=null},5500)}
function openModal(html,mount){lastFocus=document.activeElement;$('#mbody').innerHTML=html;$('#modal').hidden=false;document.body.style.overflow='hidden';mount&&mount();const f=$('#mbody [autofocus]')||$('#mbody input,#mbody select');f&&f.focus()}
function closeModal(){$('#modal').hidden=true;$('#mbody').innerHTML='';document.body.style.overflow='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
function go(v){view=v;try{location.hash=v}catch(e){}render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('#nav [data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view?'page':'false'));
  if(!loaded){$('#view').innerHTML='<p class="loading">Opening your ledger…</p>';return}
  $('#view').innerHTML=({home:renderHome,ledger:renderLedger,budgets:renderBudgets,recurring:renderRecurring,options:renderSettings}[view]||renderHome)();
}
const seg=(name,opts,val)=>`<div class="seg">${opts.map(([v,l,dot])=>`<label><input type="radio" name="${name}" value="${esc(v)}" ${v===val?'checked':''}><span>${dot?`<i class="dot" style="background:${esc(dot)}"></i>`:''}${esc(l)}</span></label>`).join('')}</div>`;
function entryRow(e){
  const c=Cat(e.catId),ref=e.amount<0;
  return `<button class="row" data-act="editEntry" data-id="${esc(e.id)}"><i class="dot" style="background:${esc(c.color)}"></i><span class="rt"><span class="rn">${esc(e.note||c.name)}</span><span class="rm">${[e.note?c.name:'',PAY[e.pay]||'',ref?'Refund':'',e.rec?'Recurring':'',view==='ledger'&&B(e.budgetId)?B(e.budgetId).name:''].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</span></span><span class="ra ${ref?'pos':''}">${ref?'+'+fmt(-e.amount):fmt(e.amount)}<small>${dlabel(e.date)}</small></span></button>`;
}

/* ---------- views ---------- */
function renderHome(){
  const bs=activeBudgets();
  if(!bs.length)return `<section class="empty"><h1>Start with one pot of money</h1><p class="mut">A budget is an amount you plan to spend: a monthly allowance that resets each cycle, or a one-off pot for a trip or an event. Expenses come out of it, and this page shows what's left and whether you're on pace.</p><div class="acts"><button class="btn pri" data-act="newBudget" data-type="monthly">Create a monthly budget</button><button class="btn" data-act="newBudget" data-type="oneoff">Create a one-off pot</button></div></section>`;
  if(!B(sel)||B(sel).archived)sel=bs[0].id;
  const b=B(sel),st=stats(b),over=st.remaining<0;
  const pct=st.total>0?Math.min(100,Math.max(0,st.spent/st.total*100)):(st.spent>0?100:0);
  const exp=st.pace&&st.total>0?Math.min(100,st.pace.expected/st.total*100):null;
  let pace='';
  if(over)pace=`<p class="pace neg"><strong>Over budget by ${fmt(-st.remaining)}.</strong> Top it up from Budgets if more money came in.</p>`;

function warnFor(f){
  const d=Object.fromEntries(new FormData(f)),b=B(d.budget);if(!b)return['',''];

  if(a>0&&lim&&cs>lim)m.push(`This puts ${c.name} at ${Math.round(cs/lim*100)}% of its ${fmt(lim)} limit.`);
  if(a>0&&st.spent+a>st.total)m.push(`This takes ${b.name} over by ${fmt(st.spent+a-st.total)}.`);
  return m.length?['bad',m.join(' ')+' You can still save it.']:['',`${fmt(st.remaining-a)} left in ${b.name} after this.`];
}

async function exportCsv(){
  const rows=[['Date','Amount (MYR)','Type','Category','Budget','Payment','Note']];
  const L=all().map(e=>[e.date,e.amount.toFixed(2),e.amount<0?'Refund':'Expense',Cat(e.catId).name,(B(e.budgetId)||{}).name||'',PAY[e.pay]||'',e.note||'']);
  cfg.budgets.forEach(b=>(b.topups||[]).forEach(t=>L.push([t.date,(-t.amount).toFixed(2),'Top-up','',b.name,'',t.note||''])));
  L.sort((a,z)=>a[0]<z[0]?-1:a[0]>z[0]?1:0);
  const csv=rows.concat(L).map(r=>r.map(v=>{v=String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;
  if(dl){try{await dl.save({filename:'ringgit-ledger-'+today()+'.csv',data:csv});toast('CSV exported')}catch(e){toast('Export cancelled')}return}
  try{await navigator.clipboard.writeText(csv);toast('CSV copied. Paste it into Excel or Google Sheets.')}
  catch(e){openModal(`<h2>Your CSV</h2><p class="mut">Select all and copy, then paste into a spreadsheet.</p><textarea class="csv" readonly>${esc(csv)}</textarea><div class="mf"><button class="btn" data-act="close">Close</button></div>`)}
}

  sel:t=>{sel=t.dataset.id;render()},
  editEntry:t=>{const e=all().find(x=>x.id===t.dataset.id);e&&entryForm(e)},
  delEntry:t=>{const r=removeEntry(t.dataset.id);closeModal();render();if(r)toast('Entry deleted',()=>{upsertEntry(r);render()})},
  undo:()=>{const f=undoFn;undoFn=null;$('#toast').hidden=true;f&&f()},
  newBudget:t=>budgetForm(null,t.dataset.type),editBudget:t=>budgetForm(B(t.dataset.id)),
  topup:t=>{const b=B(t.dataset.id);openModal(`<h2>Top up ${esc(b.name)}</h2><form id="tf" data-id="${esc(b.id)}"><label for="ta">Amount (RM)</label><input id="ta" name="amount" class="amt" inputmode="decimal" placeholder="0.00" autofocus><label for="tdt">Date</label><input id="tdt" type="date" name="date" value="${today()}"><label for="tn">Note (optional)</label><input id="tn" name="note" maxlength="80" placeholder="e.g. Duit raya, side job"><p class="err" id="terr"></p><div class="mf"><button class="btn pri" type="submit">Add money</button><button class="btn" type="button" data-act="close">Cancel</button></div></form>`)},
  archive:t=>{B(t.dataset.id).archived=true;if(sel===t.dataset.id)sel=null;saveCfg();render();toast('Budget archived')},
  unarchive:t=>{B(t.dataset.id).archived=false;saveCfg();render()},
  delBudget:t=>twoTap(t,()=>{const id=t.dataset.id;cfg.budgets=cfg.budgets.filter(b=>b.id!==id);cfg.recurring=cfg.recurring.filter(r=>r.budgetId!==id);saveCfg();render();toast('Budget deleted')}),
  newRec:()=>recForm(),editRec:t=>recForm(cfg.recurring.find(r=>r.id===t.dataset.id)),
  postRec:t=>{const r=cfg.recurring.find(x=>x.id===t.dataset.id),s=recState(r);postRec(r,s.c,s.due<today()?s.due:today());saveCfg();render();toast(`${r.name} posted`)},
  skipRec:t=>{const r=cfg.recurring.find(x=>x.id===t.dataset.id);mark(r,recState(r).c.start,'skipped');saveCfg();render();toast(`${r.name} skipped this cycle`,()=>{mark(r,recState(r).c.start,'');saveCfg();render()})},
  unskipRec:t=>{const r=cfg.recurring.find(x=>x.id===t.dataset.id);mark(r,recState(r).c.start,'');if(!runRecurring())saveCfg();render()},
  toggleRec:t=>{const r=cfg.recurring.find(x=>x.id===t.dataset.id);r.active=!r.active;if(!(r.active&&runRecurring()))saveCfg();render()},
  delRec:t=>twoTap(t,()=>{cfg.recurring=cfg.recurring.filter(r=>r.id!==t.dataset.id);delete cfg.posted[t.dataset.id];saveCfg();render()}),
  delCat:t=>{const id=t.dataset.id,n=all().filter(e=>e.catId===id).length+cfg.recurring.filter(r=>r.catId===id).length;
    if(n){toast(`${Cat(id).name} is used ${n} time${n>1?'s':''}. Rename it instead.`);return}
    twoTap(t,()=>{cfg.categories=cfg.categories.filter(c=>c.id!==id);cfg.budgets.forEach(b=>{if(b.limits)delete b.limits[id]});saveCfg();render()})},
  export:()=>exportCsv()
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){e.preventDefault();ACT[t.dataset.act](t,e)}});
document.addEventListener('submit',e=>{const f=e.target;if(SUBMIT[f.id]){e.preventDefault();SUBMIT[f.id](f)}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){filt.q=e.target.value;$('#llist').innerHTML=ledgerList()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fm'||t.id==='fb'){filt[t.id==='fm'?'m':'b']=t.value;$('#llist').innerHTML=ledgerList()}
  else if(t.id==='cd'){cfg.cycleDay=+t.value;saveCfg();if(!runRecurring())0;render()}
  else if(t.dataset.cat){const c=cfg.categories.find(x=>x.id===t.dataset.cat),v=t.value.trim();if(c&&v&&v!==c.name){c.name=v;saveCfg();toast('Category renamed')}else t.value=c?c.name:''}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==view){view=v;render()}});

/* ---------- boot ---------- */
async function boot(){
  render();
  let dbn=null,user=null,id=null;
  try{if(window.claude&&window.claude.use)[dbn,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  try{id=user?await user.id():null}catch(e){}
  if(!dbn||!id){
    local=true;try{const v=JSON.parse(localStorage.getItem('rl-data')||'null');if(v){cfg=normalize(v.cfg);months=v.months||{}}}catch(e){}
    loaded=true;note('Saving in this browser only. Sign in on claude.ai to keep your ledger in your account.');runRecurring();render();return;
  }
  col=dbn.collection('data/users/'+id);
  const timer=setTimeout(()=>{note(loaded?'Your saved data may be out of date. Checking the connection…':"Can't reach your saved data yet. Check your connection.")},10000);
  col.onSnapshot(snap=>{
    let c=null;const m={};
    snap.docs.forEach(d=>{if(!d.exists)return;const v=d.data();if(d.id==='config')c=JSON.parse(JSON.stringify(v));else if(d.id.startsWith('m_'))m[d.id.slice(2)]=JSON.parse(JSON.stringify(v.entries||[]))});
    if(!snap.metadata.fromCache){clearTimeout(timer);note('')}
    if(!c&&snap.metadata.fromCache&&!loaded)return;
    cfg=normalize(c||(loaded?cfg:null));months=m;loaded=true;
    if(!snap.metadata.fromCache&&!recRan){recRan=true;runRecurring()}
    if(document.activeElement&&document.activeElement.id==='fq'&&$('#llist'))$('#llist').innerHTML=ledgerList();else render();
  },err=>{clearTimeout(timer);note('Your saved data is unavailable right now. Changes may not be kept.');if(!loaded){loaded=true;render()}});
}
boot();
}
</script>
</body>
</html>
